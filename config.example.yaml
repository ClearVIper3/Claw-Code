# ThoughtCoding 配置模板
# 用法：复制为 config.yaml（config.yaml 已被 .gitignore 忽略，不会提交），填入你的 DeepSeek API Key。
# 注意：本项目使用 langchain4j 原生 function calling，必须使用【支持 function calling 的】DeepSeek 模型。

models:
  deepseek-chat:
    name: deepseek-chat                     # ← 换成你账号下支持 function calling 的模型
    baseURL: https://api.deepseek.com/v1
    apiKey: YOUR_DEEPSEEK_API_KEY_HERE       # ← 填入你的 API Key
    streaming: true
    maxTokens: 4096
    temperature: 0.7

defaultModel: deepseek-chat

ai:
  autoProcessToolResults: true  # true=工具结果自动回喂模型，形成 agentic 多轮循环
  maxToolIterations: 10         # 单次用户输入内的最大工具轮次上限
  # —— 四层上下文压缩管线（顺序：L3落盘 → L1裁中段 → L2旧结果占位 → L4摘要）——
  maxContextTokens: 48000       # L4：估算 token 超过则 LLM 摘要旧历史（DeepSeek ~64K 窗口留余量）
  maxMessages: 50               # L1：消息条数超过则裁中段（保留头尾）
  snipKeepHead: 3               # L1：保留最前 N 条
  snipKeepTail: 20              # L1：保留最近 N 条
  keepRecentToolResults: 3      # L2：仅最近 N 条工具结果保留全文，更旧的换占位
  maxToolResultBytes: 200000    # L3：当轮工具结果聚合预算（字节），这批总量超过才触发落盘（单次大 read 落在预算内不受影响）
  perResultPersistBytes: 30000  # L3：触发后只落盘单条超过此字节数的结果，留标记+预览+磁盘路径
  l4KeepTail: 6                 # L4：摘要后接回的最近 N 条

# —— 记忆系统（Memory，非工具）：LLM 驱动 召回注入 / 储存 / 整理 dream ——
# 存储于 <工作目录>/.memory/（MEMORY.md 索引 + 单条 .md，随项目走）。
# 索引（name+简介）常驻注入 system prompt；相关记忆全文由 LLM 每轮召回后注入；轮末自动抽取新记忆。
memory:
  enabled: true                 # 总开关：加载 .memory/ + 索引注入 + 召回/储存/整理
  autoExtract: true             # 每轮对话结束后自动抽取新记忆（需一次模型往返，可关）
  consolidateThreshold: 10      # 记忆文件数达到此值触发 LLM 整合去重（0=禁用）
  maxIndexEntries: 200          # MEMORY.md 索引条数上限（超限裁掉最早写入的）
  maxPerTurnInjections: 5       # 单轮自动注入的相关记忆条数上限

# —— 任务系统（Task，确定性 CRUD，非工具开关）——
# 存储于 <工作目录>/.tasks/（每个任务一个 <id>.json + .seq 计数），跨会话保留。
# 取代旧 todo_write：6 个工具 task_create/list/get/update/claim/complete，支持 blockedBy 依赖图 + owner/claim 生命周期。
tasks:
  enabled: true                 # 总开关：装配任务系统（加载 .tasks/ + 注册 6 个 task 工具 + 注入未完成摘要）

# —— 定时任务系统（Cron，确定性调度，非工具开关）——
# 存储于 <工作目录>/.scheduled_tasks.json（仅 durable 任务落盘），跨会话恢复。
# 3 个工具：cron_schedule / cron_list / cron_cancel；到点后即使停在 thought> 也会自动跑一轮 Agent
# （需交互模式；-p 单次模式只落盘不自动触发）。
cron:
  enabled: true                 # 总开关：装配定时任务系统（加载 .scheduled_tasks.json + 注册 cron 工具 + 到点自动唤醒执行）

tools:
  bash:
    enabled: true
  read:
    enabled: true
  write:
    enabled: true
  edit:
    enabled: true
  glob:
    enabled: true
